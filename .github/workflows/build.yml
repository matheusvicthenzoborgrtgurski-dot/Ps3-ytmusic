name: Build CELL MUSIC PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PS3 build environment
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3dev.git /tmp/ps3dev
          cd /tmp/ps3dev
          sudo ./prepare.sh

      - name: Build PS3 toolchain and PSL1GHT
        run: |
          sudo mkdir -p "$PS3DEV"
          sudo chown -R "$USER":"$USER" "$PS3DEV"
          cd /tmp/ps3dev
          # Sem sudo: o prefixo ja pertence a $USER e o sudo descartaria
          # PS3DEV/PSL1GHT do ambiente, que build-all.sh exige.
          ./build-all.sh
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Build application and package
        run: |
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          # Confirma que a compilacao e a linkagem usam o toolchain PowerPC64 PS3.
          ppu-gcc -dumpmachine
          command -v ppu-gcc
          make clean
          make VERBOSE=1
          make VERBOSE=1 pkg
          test -s cell-music.pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: cell-music-pkg
          path: cell-music.pkg
          if-no-files-found: error
